<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de Camisas · Alento Das Torcidas</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700;1,800&family=Barlow:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="capa">
  <img src="logo.jpg" alt="Alento Das Torcidas — Camisas de Futebol">
</header>

<div class="wrap">
  <section class="painel redes" aria-label="Contato">
    <a class="btn-escuro it" id="link-insta" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      Instagram
    </a>
    <a class="btn-escuro it" id="link-zap" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 1-13.4 7.9L3 21l1.2-4.4A9 9 0 1 1 21 12z"/><path d="M8.5 8.5c.3 2.9 2.6 5.6 6 7l1.3-1.5-2-1-1 .8c-1-.5-2-1.5-2.5-2.5l.8-1-1-2z" fill="currentColor" stroke="none"/></svg>
      WhatsApp
    </a>
  </section>

  <nav class="painel abas" role="tablist" aria-label="Como procurar">
    <button class="btn-escuro it" role="tab" data-aba="times">Por Times</button>
    <button class="btn-escuro it" role="tab" data-aba="tamanho">Por Tamanho</button>
    <button class="btn-escuro it" role="tab" data-aba="todos">Todos os Modelos</button>
    <button class="btn-escuro it" role="tab" data-aba="medidas">Medidas</button>
  </nav>

  <div class="busca"><input id="busca" type="search" placeholder="Buscar camisa ou time..." aria-label="Buscar camisa ou time"></div>

  <main id="conteudo"></main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Detalhes da camisa">
  <div class="modal-box" id="modal-box"></div>
</div>

<footer>© <span id="ano"></span> Alento Das Torcidas · Camisas de Futebol</footer>

<script src="config.js"></script>
<script src="produtos-base.js"></script>
<script src="estoque.js"></script>
<script src="comum.js"></script>
<script src="catalogo.js"></script>
</body>
</html>
